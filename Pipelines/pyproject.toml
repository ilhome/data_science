[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelines"
version = "0.1.0"
description = "Airflow-orchestrated FX rates ETL with retries, data quality gate and alerts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1",
  "requests>=2.31",
  "sqlalchemy>=1.4",
  "python-dotenv>=1.0",
]

[project.scripts]
fx-etl = "pipelines.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Keep typing.Optional/Union: the project supports Python 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "tests"]
known-third-party = ["airflow"]
