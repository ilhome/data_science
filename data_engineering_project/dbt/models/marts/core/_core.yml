version: 2

models:
  - name: dim_customers
    description: One row per customer with lifetime behaviour and a simple segment.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: [VIP, Repeat, One-time]

  - name: dim_products
    description: Product catalog (seed) plus unknown products observed in sales.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]

  - name: dim_date
    description: Calendar dimension covering every year with sales.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_sales
    description: Order-line fact table (incremental, keyed on sales_line_key).
    columns:
      - name: sales_line_key
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: quantity
        data_tests: [is_positive]
