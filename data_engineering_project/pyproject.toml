[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-project"
version = "0.2.0"
description = "End-to-end retail analytics pipeline: Python ETL, PostgreSQL, dbt, and Airflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.1",
]

[project.scripts]
retail-pipeline = "data_engineering_project.pipeline:main"
retail-generate-data = "data_engineering_project.generate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Keep typing.Optional/Union: the project supports Python 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]
